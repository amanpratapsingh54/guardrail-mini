name: guardrail-mini

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: guardrail-mini:local
  env_file:
    - path: .env
      required: false
  environment: &app-environment
    GUARDRAIL_ENVIRONMENT: compose
    GUARDRAIL_HOST: 0.0.0.0
    GUARDRAIL_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-guardrail}:${POSTGRES_PASSWORD:-guardrail_dev_only}@postgres:5432/${POSTGRES_DB:-guardrail}"
    GUARDRAIL_MODEL_DEVICE: "${GUARDRAIL_MODEL_DEVICE:-cpu}"
    GUARDRAIL_MODEL_RUNTIME: "${GUARDRAIL_MODEL_RUNTIME:-onnxruntime}"
    GUARDRAIL_RATE_LIMIT_REQUESTS_PER_MINUTE: "${GUARDRAIL_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}"
    GUARDRAIL_DEMO_ENABLED: "${GUARDRAIL_DEMO_ENABLED:-true}"
    GUARDRAIL_DEMO_RATE_LIMIT_REQUESTS_PER_MINUTE: "${GUARDRAIL_DEMO_RATE_LIMIT_REQUESTS_PER_MINUTE:-10}"
    OMP_NUM_THREADS: "${OMP_NUM_THREADS:-2}"
    GUARDRAIL_ONNX_CACHE_DIR: /app/data/onnx-cache
    GUARDRAIL_ARTIFACT_CACHE_DIR: /app/data/model-cache
    GUARDRAIL_MINIO_ENDPOINT_URL: http://minio:9000
    GUARDRAIL_MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-guardrailminio}"
    GUARDRAIL_MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-guardrailminio_dev_only}"
    GUARDRAIL_MINIO_BUCKET: guardrail-models
  volumes:
    - model-artifacts:/app/models
    - app-data:/app/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-guardrail}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-guardrail_dev_only}"
      POSTGRES_DB: "${POSTGRES_DB:-guardrail}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: guardrail-minio:local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-guardrailminio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-guardrailminio_dev_only}"
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  model-init:
    <<: *app
    command:
      - sh
      - -ec
      - |
        python scripts/prepare_compose_models.py
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-guardrail_grafana_dev_only}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  app-data:
  grafana-data:
  minio-data:
  model-artifacts:
  postgres-data:
  prometheus-data:
