[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "guardrail-mini"
version = "0.1.0"
description = "A small, production-minded ML guardrail API."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "boto3>=1.36,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.21,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.6,<3",
    "transformers>=5.10.2,<6",
]
pii = [
    "presidio-analyzer>=2.2.359,<3",
    "spacy>=3.8,<4",
]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail_mini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
