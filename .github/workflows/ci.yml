name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          --extra-index-url https://pypi.org/simple
          --index-url https://download.pytorch.org/whl/cpu
          "torch>=2.6,<3"

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev,ml,pii,onnx]"

      - name: Install spaCy English model
        run: python -m spacy download en_core_web_sm

      - name: Download pinned guardrail models
        run: |
          python scripts/download_model.py
          python scripts/download_prompt_injection_model.py

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check types
        run: mypy src tests scripts migrations

      - name: Run tests
        run: pytest -q
